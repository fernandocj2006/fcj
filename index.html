<!DOCTYPE html>
<html>
<body>
    <!-- Figure con Vídeo -->
    <figure>
        <video src="https://www.ejemplo.com/a.mp4" width="320" height="180" controls muted></video>
        <figcaption>Vídeo en bucle</figcaption>
    </figure>
    <!-- Audio -->
    <audio src="https://www.w3schools.com/html/horse.ogg" controls loop></audio>
    <!-- iframe -->
    <iframe src="https://example.com" width="300" height="150"></iframe>
    <!-- Canvas con dibujo -->
    <canvas id="c" width="100" height="100"></canvas>
    <script>
        document.getElementById('c').getContext('2d').fillRect(10, 10, 80, 80);
    </script>
</body>
</html>
